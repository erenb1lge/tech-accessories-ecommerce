<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order placed — Tech Accessories</title>

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/order-success.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Primary">
      <a class="brand" href="../index.html" aria-label="Tech Accessories Home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Tech Accessories</span>
      </a>

      <div class="nav-links" role="navigation">
        <a href="./products.html">Shop</a>
        <a href="../index.html#featured">Featured</a>
        <a href="./support.html">Support</a>
        <a href="./contact.html">Contact</a>
      </div>

      <div class="nav-actions">
        <a class="icon-btn" href="./cart.html" aria-label="Open cart">
          <span class="icon" aria-hidden="true">🛒</span>
          <span class="badge" data-cart-badge>0</span>
        </a>

        <button class="icon-btn nav-toggle" type="button"
          data-nav-toggle
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="mobile-nav">
          <span class="hamburger" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
        </button>
      </div>
    </nav>

    <div id="mobile-nav" class="mobile-nav" data-mobile-nav aria-label="Mobile menu">
      <a href="./products.html">Shop</a>
      <a href="../index.html#featured">Featured</a>
      <a href="./support.html">Support</a>
      <a href="./contact.html">Contact</a>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <section class="success">
        <div class="check" aria-hidden="true">✓</div>
        <h1 class="title">Order placed</h1>
        <p class="muted" data-order-line>Your order has been confirmed.</p>

        <div class="card">
          <div class="row">
            <span class="muted">Order ID</span>
            <span data-order-id>—</span>
          </div>
          <div class="row">
            <span class="muted">Total</span>
            <span data-order-total>—</span>
          </div>
          <div class="row">
            <span class="muted">Email</span>
            <span data-order-email>—</span>
          </div>
        </div>

        <div class="actions">
          <a class="btn btn-solid" href="./products.html">Continue shopping</a>
          <a class="btn btn-ghost" href="../index.html">Back home</a>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-grid">
      <div>
        <p class="footer-title">Tech Accessories</p>
        <p class="footer-muted">A minimalist e-commerce demo built with HTML, CSS, and JavaScript.</p>
      </div>
      <div class="footer-links">
        <a href="./products.html">Shop</a>
        <a href="./cart.html">Cart</a>
        <a href="./support.html">Support</a>
        <a href="./contact.html">Contact</a>
      </div>
    </div>
  </footer>

  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/order-success.js"></script>
</body>
</html>
